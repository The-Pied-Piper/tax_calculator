# Form T2042, Statement of Farming Activities: ca/t2042, run once per statement of
# ca/t2042_statements. Its fields are the T2042 inputs. It exports its line 9946 "Your net income
# (loss)", which T1 line 14100 "Net" adds over the statements (03s_t2042_restricted_farm_loss.yaml),
# and lines nothing on the return reads, as outputs, one record each. Charts B and C's
# constants are its vehicle datasets. The sixth to fourteenth exports are Chart A of Form T2043
# (03h_t2043_chart_a.yaml): amounts 6 and 8 of each designated province, read by Form T2043 per
# statement. The next 26 are Charts B and C of Form T2043 (03j_t2043_chart_b.yaml,
# 03k_t2043_chart_c.yaml): totals of rows 1 and 4 of each designated province
# (03l_t2043_chart_b_provinces.yaml), rows 2 and 5 if it uses Chart B, else 0, and Chart C's amounts
# 7 to 14, read by Form T2043 as `ca/t2042.<export>`. The Area F and H lines 9923-9924,
# 9929-9930 and Part 9 lines 9931-9933, as entered, unread. The last nine are each place's presence
# (03o_t2043_places_present.yaml), read by Form T2043.
