# Form T2125, Statement of Business or Professional Activities: the form ca/t2125, run once for each
# statement of ca/t2125_statements (any number). Each statement's fields are the T2125
# inputs. The form reads line 9946 and line 8299 and exports them routed by line code (1 business, 2
# professional, 3 commission): net_on_* and gross_on_* records, which T1 lines 13500 to 13899 total.
# Area F lines 9923-9924 and Part 9 lines 9931-9933 are taken as entered. Charts B and C's
# constants are the datasets of the motor vehicle step.
form:
  name: ca/t2125
  required: true
  instances: ca/t2125_statements
  exports:
    - ca/net_on_business_line
    - ca/net_on_professional_line
    - ca/net_on_commission_line
    - ca/gross_on_business_line
    - ca/gross_on_professional_line
    - ca/gross_on_commission_line
    - ca/business_closing_ucc
    - ca/business_home_carry_forward
    - ca/business_immediate_expensing_claim
    - ca/business_immediate_expensing_limit_unprorated
    - ca/business_land_additions
    - ca/business_land_dispositions
    - ca/business_liabilities
    - ca/business_drawings
    - ca/business_capital_contributions
    - ca/business_journalism_labour_tax_credit
  fields:
    - name: ca/business_income_line
      required: true
    - name: ca/business_gross_sales
      required: true
    - name: ca/business_sales_adjustments
      required: true
    - name: ca/business_quick_method_gst_hst
      required: true
    - name: ca/business_quick_method_remitted
      required: true
    - name: ca/business_reserves_deducted_last_year
      required: true
    - name: ca/business_other_income
      required: true
    - name: ca/business_opening_inventory
      required: true
    - name: ca/business_purchases
      required: true
    - name: ca/business_direct_wage_costs
      required: true
    - name: ca/business_subcontracts
      required: true
    - name: ca/business_other_costs
      required: true
    - name: ca/business_closing_inventory
      required: true
    - name: ca/business_advertising
      required: true
    - name: ca/business_meals_and_entertainment
      required: true
    - name: ca/business_bad_debts
      required: true
    - name: ca/business_insurance
      required: true
    - name: ca/business_interest_and_bank_charges
      required: true
    - name: ca/business_business_taxes_licences_and_memberships
      required: true
    - name: ca/business_office_expenses
      required: true
    - name: ca/business_office_stationery_and_supplies
      required: true
    - name: ca/business_professional_fees
      required: true
    - name: ca/business_management_and_administration_fees
      required: true
    - name: ca/business_rent
      required: true
    - name: ca/business_repairs_and_maintenance
      required: true
    - name: ca/business_salaries_wages_and_benefits
      required: true
    - name: ca/business_property_taxes
      required: true
    - name: ca/business_travel_expenses
      required: true
    - name: ca/business_utilities
      required: true
    - name: ca/business_fuel_costs
      required: true
    - name: ca/business_delivery_freight_and_express
      required: true
    - name: ca/business_vehicle_sales_tax_rate
      required: true
    - name: ca/business_cca_personal_part
      required: true
    - name: ca/business_other_expenses
      required: true
    - name: ca/business_journalism_labour_tax_credit
      required: true
    - name: ca/business_partner_gst_hst_rebate
      required: true
    - name: ca/business_partner_other_amount_a
      required: true
    - name: ca/business_partner_other_amount_b
      required: true
    - name: ca/business_partner_other_amount_c
      required: true
    - name: ca/business_partner_other_amount_d
      required: true
    - name: ca/business_partner_other_amount_e
      required: true
    - name: ca/business_home_heat
      required: true
    - name: ca/business_home_electricity
      required: true
    - name: ca/business_home_insurance
      required: true
    - name: ca/business_home_maintenance
      required: true
    - name: ca/business_home_mortgage_interest
      required: true
    - name: ca/business_home_property_taxes
      required: true
    - name: ca/business_home_other_expenses
      required: true
    - name: ca/business_home_personal_use_part
      required: true
    - name: ca/business_home_cca
      required: true
    - name: ca/business_home_carried_forward
      required: true
    - name: ca/business_partner_share
      required: true
    - name: ca/business_partner
      required: true
    - name: ca/business_fiscal_period_from
      required: true
    - name: ca/business_fiscal_period_to
      required: true
    - name: ca/business_land_additions
      required: true
    - name: ca/business_land_dispositions
