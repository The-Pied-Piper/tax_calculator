# Form ON-BEN Part B "I declare the following information about my principal residences in Ontario
# during 2025": the form ca-on/on_ben_residences, run once for each row of the table (the record
# list ca-on/on_ben_residence_rows, any number, none included: the form's table has four entries
# and says to use a separate sheet for more). The form computes nothing; it checks the long-term
# care tick of its row and the row's months against the 12 months of the year, and exports them
# with the amount as entered. Rows are not added: one home with rent, property tax and energy costs
# paid to different payees takes a row for each, each with the same months.
form:
  name: ca-on/on_ben_residences
  required: true
  instances: ca-on/on_ben_residence_rows
  exports:
    - ca-on/on_ben_residence_months_checked
    - ca-on/on_ben_residence_amount
    - ca-on/on_ben_residence_long_term_care_checked
  fields:
    - name: ca-on/on_ben_residence_months
      required: true
    - name: ca-on/on_ben_residence_amount
      required: true
    - name: ca-on/on_ben_residence_long_term_care
      required: true
capabilities:
  # Part B column 5 "Tick this box if it is a long-term care home": a tick box, a count of 1 or 0,
  # checked before it is exported. A count of 2 or more is refused, not capped.
  - name: ca/yes_or_no_count
    consumes:
      count: ca-on/on_ben_residence_long_term_care
    produces:
      output: ca-on/on_ben_residence_long_term_care_checked
  # The 12 months of the year, the `on_ben_months_in_year` dataset as an artifact of the same name.
  - name: core/credit_amount
    params:
      amount: ca-on/on_ben_months_in_year
    produces:
      output: ca-on/on_ben_months_in_year
  # Part B column 3 "Number of months resident in 2025" may not be more than the months in the year.
  # The form does not print that cap; it follows from the length of the year. A row above it is an
  # input error, not capped.
  - name: core/at_most
    consumes:
      amount: ca-on/on_ben_residence_months
      bound: ca-on/on_ben_months_in_year
    produces:
      output: ca-on/on_ben_residence_months_checked
