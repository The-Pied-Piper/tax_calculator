# Form T929, Disability Supports Deduction, the form ca/t929, run once for the copy of the form the
# return carries (the record list ca/t929_instances: none or one; the record has no fields, because
# every figure the form takes is a manifest input). Its line 12 is the disability supports deduction
# of T1 line 21500, which the return totals in 05_deductions.yaml. The form exports its lines 3, 4, 7,
# 9, 10 and 11 as well, which nothing on the return reads.
# Line 5, "Enter your net income", is the net income of the return with no claim on line 21500: the
# copies of the return's steps in 05l_t929_copies_1.yaml, 05m_t929_copies_2.yaml,
# 05x_t929_copies_3.yaml and 05p_t1436_lines_1_to_7_t929.yaml, which the form reads and the return does not, because a form
# reads the manifest's inputs and other forms' exports only. The Form T929 "Eligibility criteria",
# "Expenses you can claim" and "Amounts you cannot claim"
# text is the caller's to apply: each figure entered is the amount the filer takes as eligible.
form:
  name: ca/t929
  required: true
  instances: ca/t929_instances
  # The return carries at most one copy of Form T929.
  max_instances: 1
  min_instances: 0
  exports:
    - ca/t929_line_3
    - ca/t929_line_4
    - ca/t929_line_7
    - ca/t929_line_9
    - ca/t929_line_10
    - ca/t929_line_11
    - ca/disability_supports_deduction
  fields: []
capabilities:
  # Form T929 Step 1 line 3 "Subtract line 2 from line 1. This amount is your net disability supports
  # expenses": line 1 "Enter the total of all amounts in column 2" less line 2 "Enter the total of all
  # amounts in column 3". The form does not floor it.
  - name: core/subtract
    consumes:
      amount: ca/t929_expenses_paid
      less: ca/t929_expenses_reimbursed
    produces:
      output: ca/t929_line_3
  # Form T929 Step 2 line 4 "Enter your earned income", the definition "net self-employment income,
  # either alone or as an active partner (not including losses)", for the statements of Form T2125:
  # the positive net income of each statement counts, a loss counts 0.
  # Read through Form T1139's summary form (ca/t1139_return): the profit on the line of the return,
  # so amount G or L of a Form T1139 takes the place of its statements.
  - name: core/record_total
    consumes:
      records: ca/t1139_return.t1139_business_profit_on_return
    produces:
      output: ca/t929_net_business_income
  # The same definition, for the statements of Form T2042 (farming): a loss counts 0.
  # Read through Form T1139's summary form (ca/t1139_return): the profit on the line of the return,
  # so amount G or L of a Form T1139 takes the place of its statements.
  - name: core/record_total
    consumes:
      records: ca/t1139_return.t1139_farming_profit_on_return
    produces:
      output: ca/t929_net_farming_income
  # The same definition, for the statements of Form T2121 (fishing): a loss counts 0.
  # Read through Form T1139's summary form (ca/t1139_return): the profit on the line of the return,
  # so amount G or L of a Form T1139 takes the place of its statements.
  - name: core/record_total
    consumes:
      records: ca/t1139_return.t1139_fishing_profit_on_return
    produces:
      output: ca/t929_net_fishing_income
  # The same definition, for professional income (T1 line 13700): a loss counts 0.
  # Read through Form T1139's summary form (ca/t1139_return): the profit on the line of the return
  # ("use only the profit amounts"), so amount G or L of a Form T1139 takes the place of them.
  - name: core/record_total
    consumes:
      records: ca/t1139_return.t1139_professional_profit_on_return
    produces:
      output: ca/t929_net_professional_income
  # The same definition, for commission income (T1 line 13900): a loss counts 0.
  # Read through Form T1139's summary form (ca/t1139_return): the profit on the line of the return
  # ("use only the profit amounts"), so amount G or L of a Form T1139 takes the place of them.
  - name: core/record_total
    consumes:
      records: ca/t1139_return.t1139_commission_profit_on_return
    produces:
      output: ca/t929_net_commission_income
  # Form T929 Step 2 line 4 "Enter your earned income", the definition "employment income (including
  # security options and other employment benefits)" (T1 lines 10100 and 10400), "the taxable part of
  # scholarships, bursaries, fellowships, and similar awards" (T1 line 13010), the net self-employment
  # income of the four lines above, and the other items of the definition: "net research grants", "any
  # earnings supplement received under a project sponsored by a government in Canada to encourage
  # employment", "any financial support received under a program sponsored under Part II of the
  # Employment Insurance Act, or any similar program", "any financial support received under a program
  # that provides income replacement benefits similar to those provided under the Employment Insurance
  # Act", "any amounts received under the Wage Earner Protection Program Act in respect of wages", and
  # "any federal, provincial or territorial government COVID-19 payments received in the year for which
  # you have received a T4A or T4E".
  - name: core/sum
    consumes:
      parts:
        - ca/employment_income
        - ca/other_employment_income
        - ca/taxable_scholarships
        - ca/t929_net_business_income
        - ca/t929_net_farming_income
        - ca/t929_net_fishing_income
        - ca/t929_net_professional_income
        - ca/t929_net_commission_income
        - ca/t929_net_research_grants
        - ca/t929_earnings_supplements
        - ca/t929_employment_insurance_part_2_support
        - ca/t929_income_replacement_support
        - ca/t929_wage_earner_protection_amounts
        - ca/t929_covid_19_payments
    produces:
      output: ca/t929_line_4
  # Form T929 Step 2 line 7 "Line 5 minus line 6 (if negative, enter "0")": line 5 "Enter your net
  # income" (the copied net income of line 23600 with no claim) less line 6 "Enter your earned income
  # from line 4", not below zero.
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca/net_income
      less: ca/t929_line_4
    produces:
      output: ca/t929_line_7
  # Form T929 Step 2 line 9 "Line 8 multiplied by $375": line 8 "Enter the number of weeks in the year that
  # you attended the institution or secondary school" times the weekly amount of the dataset. Rounded
  # half-up to the cent by that dataset's rounding.
  - name: core/per_unit_amount
    params:
      amount: ca/t929_weekly_amount
    consumes:
      count: ca/t929_weeks_attended
    produces:
      output: ca/t929_line_9
  # Form T929 Step 2 line 10 "Enter the amount from line 7 or line 9, whichever is less. (maximum
  # $15,000)": the lesser of lines 7 and 9, capped at the maximum of the dataset.
  - name: ca/lesser_of_with_maximum
    params:
      maximum: ca/t929_maximum
    consumes:
      amounts:
        - ca/t929_line_7
        - ca/t929_line_9
    produces:
      output: ca/t929_line_10
  # Form T929 Step 2 line 11 "Add lines 4 and 10".
  - name: core/sum
    consumes:
      parts:
        - ca/t929_line_4
        - ca/t929_line_10
    produces:
      output: ca/t929_line_11
  # Form T929 Step 2 line 12 "Enter the amount from line 3 or line 11, whichever is less", the
  # disability supports deduction, which "Enter the amount from line 12 on line 21500 of your tax
  # return." The return totals it in 05_deductions.yaml.
  - name: core/lesser_of
    consumes:
      amounts:
        - ca/t929_line_3
        - ca/t929_line_11
    produces:
      output: ca/disability_supports_deduction
