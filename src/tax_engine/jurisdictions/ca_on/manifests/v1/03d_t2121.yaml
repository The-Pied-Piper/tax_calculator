# Form T2121, Statement of Fishing Activities: the form ca/t2121, run once for each statement of the
# list ca/t2121_statements (one for each fishing business; any number, none included). Each
# statement's fields are the T2121 inputs. The form exports its line 9946 "Your net income (loss)",
# which T1 line 14300 "Net" adds over the statements, and the lines nothing on the return reads,
# which the return declares as outputs, one record for each statement. The printed constants
# of Charts B and C are the datasets of the form's one motor vehicle step. Area F lines 9923 and
# 9924 and Part 9 lines 9931 to 9933 are taken as entered, unread.
form:
  name: ca/t2121
  required: true
  instances: ca/t2121_statements
  exports:
    - ca/fishing_income
    - ca/fish_closing_ucc
    - ca/fish_home_carry_forward
    - ca/fish_immediate_expensing_claim
    - ca/fish_immediate_expensing_limit_unprorated
    - ca/fish_land_additions
    - ca/fish_land_dispositions
    - ca/fish_liabilities
    - ca/fish_drawings
    - ca/fish_capital_contributions
  fields:
    - name: ca/fish_fish_products
      required: true
    - name: ca/fish_other_marine_products
      required: true
    - name: ca/fish_grants_credits_and_rebates
      required: true
    - name: ca/fish_subsidies
      required: true
    - name: ca/fish_compensation_for_loss
      required: true
    - name: ca/fish_sharesperson_income
      required: true
    - name: ca/fish_other_income
      required: true
    - name: ca/fish_salt_bait_and_ice
      required: true
    - name: ca/fish_crew_shares
      required: true
    - name: ca/fish_fuel_costs
      required: true
    - name: ca/fish_fishing_gear
      required: true
    - name: ca/fish_insurance
      required: true
    - name: ca/fish_interest_and_bank_charges
      required: true
    - name: ca/fish_meals_and_entertainment
      required: true
    - name: ca/fish_business_taxes_licences_and_memberships
      required: true
    - name: ca/business_vehicles
      required: true
    - name: ca/fish_vehicle_sales_tax_rate
      required: true
    - name: ca/fish_office_expenses
      required: true
    - name: ca/fish_nets_and_traps
      required: true
    - name: ca/fish_professional_fees
      required: true
    - name: ca/fish_salaries_wages_and_benefits
      required: true
    - name: ca/fish_repairs_fishing_boat
      required: true
    - name: ca/fish_repairs_engine
      required: true
    - name: ca/fish_repairs_electrical_equipment
      required: true
    - name: ca/fish_insurance_recovery
      required: true
    - name: ca/fish_other_expenses
      required: true
    - name: ca/fish_cca_personal_part
      required: true
    - name: ca/fish_fiscal_period_days_entered
      required: true
    - name: ca/fish_land_additions
      required: true
    - name: ca/fish_land_dispositions
      required: true
    - name: ca/fish_liabilities
      required: true
    - name: ca/fish_drawings
      required: true
    - name: ca/fish_capital_contributions
      required: true
    - name: ca/fish_cca_classes
      required: true
    - name: ca/fish_partner
      required: true
    - name: ca/fish_partner_share
      required: true
    - name: ca/fish_partner_gst_hst_rebate
      required: true
    - name: ca/fish_partner_other_amount_a
      required: true
    - name: ca/fish_partner_other_amount_b
      required: true
    - name: ca/fish_partner_other_amount_c
      required: true
    - name: ca/fish_partner_other_amount_d
      required: true
    - name: ca/fish_partner_other_amount_e
      required: true
    - name: ca/fish_home_heat
      required: true
    - name: ca/fish_home_electricity
      required: true
    - name: ca/fish_home_insurance
      required: true
    - name: ca/fish_home_maintenance
      required: true
    - name: ca/fish_home_mortgage_interest
      required: true
    - name: ca/fish_home_property_taxes
      required: true
    - name: ca/fish_home_other_expenses
      required: true
    - name: ca/fish_home_personal_use_part
      required: true
    - name: ca/fish_home_cca
      required: true
    - name: ca/fish_home_carried_forward
      required: true
    - name: ca/fish_epop_associated
      required: true
    - name: ca/fish_epop_agreement_filed
      required: true
    - name: ca/fish_epop_percentage
      required: true
    - name: ca/fish_epop_percentage_total
      required: true
    - name: ca/fish_minister_allocation_given
      required: true
    - name: ca/fish_minister_allocation
      required: true
    - name: ca/fish_boat_mainly_personal
      required: true
capabilities:
  # T2121 Area A endnote 2 "The proceeds of disposition of a zero-emission passenger vehicle
  # (ZEPV) that has been included in Class 54, or a passenger vehicle bought after April 18, 2021,
  # that has been included in Class 10.1, and whose cost is more than the prescribed amount will
  # be adjusted based on a factor equal to its prescribed amount as a proportion of the actual
  # cost of the vehicle.": the Area A list with columns 5 and 6 of each such row scaled, which
  # the steps below read in place of the caller's list.
  # Guide T4036 2025, "Class 54 (30%)": "If a zero-emission passenger vehicle is disposed of to a
  # person or partnership with whom you deal at arm's length, and its cost exceeds the prescribed
  # amount ($55,000 for vehicles acquired after March 18, 2019, and before January 1, 2022;
  # $59,000 for vehicles acquired after December 31, 2021, and before January 1, 2023; or $61,000
  # for vehicles acquired after December 31, 2022), the proceeds of disposition will be adjusted
  # based on a factor equal to the prescribed amount as a proportion of the actual cost of the
  # vehicle.": each vehicle sold from a Class 54 row is scaled with the dataset of those amounts.
  - name: ca/cca_vehicle_proceeds
    params:
      prescribed_amounts: ca/cca_vehicle_prescribed_amounts
      zepv_prescribed_amounts: ca/cca_zepv_prescribed_amounts
    consumes:
      classes: ca/fish_cca_classes_checked
      sales_tax_rate: ca/fish_vehicle_sales_tax_rate
    produces:
      output: ca/fish_cca_classes_adjusted
  # T2121 Area A endnote 3 "If you have a negative amount in column 7, add it to income as a
  # recapture in Part 3 on line 9600. If no property is left in the class and there is a
  # positive amount in this column, deduct the amount from income as a terminal loss in Part 4
  # on line 9270.": the recapture of each class of the Area A list (column 7 made positive when
  # negative), totalled.
  - name: ca/recaptured_cca
    params:
      class_rates: ca/cca_class_rates
    consumes:
      classes: ca/fish_cca_classes_adjusted
    produces:
      output: ca/fish_recaptured_cca
  # T2121 Part 3 line 9600 "Other income (specify):", which takes the recapture of Area A (the
  # Area A endnote "add it to income as a recapture in Part 3 on line 9600"): the other income
  # the caller specifies plus the recapture.
  - name: core/sum
    consumes:
      parts:
        - ca/fish_other_income
        - ca/fish_recaptured_cca
    produces:
      output: ca/fish_other_income_with_recapture
  # T2121 Part 3 "Gross income: Total of amounts 3A to 3F and line 9600 (enter this amount on line
  # 14299 of your income tax and benefit return)" (line 8299): the caller's amounts 3A to 3F in
  # the form's order, and line 9600 with its recapture.
  - name: core/sum
    consumes:
      parts:
        - ca/fish_fish_products
        - ca/fish_other_marine_products
        - ca/fish_grants_credits_and_rebates
        - ca/fish_subsidies
        - ca/fish_compensation_for_loss
        - ca/fish_sharesperson_income
        - ca/fish_other_income_with_recapture
    produces:
      output: ca/fish_gross_income
  # T2121 Part 4 "Gross income (line 8299 of Part 3)" (4A): line 8299 alone, the gross income that
  # the expenses are taken from.
  - name: core/sum
    consumes:
      parts:
        - ca/fish_gross_income
    produces:
      output: ca/fish_gross_income_before_expenses
  # T2121 Area A endnote 3 "deduct the amount from income as a terminal loss in Part 4 on line
  # 9270": the terminal loss of each class of the Area A list, totalled.
  - name: ca/terminal_loss
    params:
      class_rates: ca/cca_class_rates
    consumes:
      classes: ca/fish_cca_classes_adjusted
    produces:
      output: ca/fish_terminal_loss
  # T2121 Part 4 "Other expenses (specify): 9270 4P": the other expenses the caller specifies plus
  # the terminal loss.
  - name: core/sum
    consumes:
      parts:
        - ca/fish_other_expenses
        - ca/fish_terminal_loss
    produces:
      output: ca/fish_other_expenses_with_terminal_loss
  # T2121 Part 4 "Repairs and maintenance: Fishing boat", "Engine", "Electrical equipment" (amounts
  # 1 to 3) and "Total of amounts 1 to 3" (amount 4): the three caller amounts added.
  - name: core/sum
    consumes:
      parts:
        - ca/fish_repairs_fishing_boat
        - ca/fish_repairs_engine
        - ca/fish_repairs_electrical_equipment
    produces:
      output: ca/fish_repairs_total
  # T2121 Part 4 "Your cost (amount 4 minus amount 5)" (line 8963, 4O): amount 4 less the
  # insurance recovery, amount 5, as the form prints it.
  - name: core/subtract
    consumes:
      amount: ca/fish_repairs_total
      less: ca/fish_insurance_recovery
    produces:
      output: ca/fish_repairs_your_cost
  # T2121 Charts A to C, "Motor vehicle expenses", filled in for each vehicle of the
  # statement's list and added: Chart A line 16 "Allowable motor vehicle expenses: Add amounts 13
  # to 15 (enter this total on line 9281 of Part 4)". The printed constants of Charts B and C
  # ("$350***", "÷ 30", "$44,706", "$1,100", "$38,000" and "× 85%") are its datasets, and the GST or
  # HST rate of the province and the days of the statement's fiscal period (Chart B line 18)
  # are its inputs, a vehicle's interest days being refused above the fiscal period's days.
  # The line 9281 kind is produced here and is no longer a caller input.
  - name: ca/business_vehicle_expenses
    params:
      interest_limits: ca/business_vehicle_interest_limits
      lease_limits: ca/business_vehicle_lease_limits
      days_divisor: ca/business_vehicle_days_divisor
      lease_price_rate: ca/business_vehicle_lease_price_rate
      deposit_minimum: ca/business_vehicle_deposit_minimum
      rounding: ca/business_vehicle_rounding
    consumes:
      vehicles: ca/business_vehicles
      sales_tax_rate: ca/fish_vehicle_sales_tax_rate
      fiscal_period_days: ca/fish_fiscal_period_days
    produces:
      output: ca/fish_motor_vehicle_expenses
  # T2121 Part 4 "Subtotal: Add amounts 4B to 4P." (4Q): the expense lines 4B to 4N, amount 4O and
  # the other expenses of line 9270 with the terminal loss.
  - name: core/sum
    consumes:
      parts:
        - ca/fish_salt_bait_and_ice
        - ca/fish_crew_shares
        - ca/fish_fuel_costs
        - ca/fish_fishing_gear
        - ca/fish_insurance
        - ca/fish_interest_and_bank_charges
        - ca/fish_meals_and_entertainment
        - ca/fish_business_taxes_licences_and_memberships
        - ca/fish_motor_vehicle_expenses
        - ca/fish_office_expenses
        - ca/fish_nets_and_traps
        - ca/fish_professional_fees
        - ca/fish_salaries_wages_and_benefits
        - ca/fish_repairs_your_cost
        - ca/fish_other_expenses_with_terminal_loss
    produces:
      output: ca/fish_expenses_subtotal
  # T2121 Area A, the days of the fiscal period (Guide T4002 "You were asking?": "Since your
  # fiscal period is less than 365 days, you have to prorate your CCA claim. ... base your CCA
  # claim on the number of days in your fiscal period compared to 365 days. In this case, your
  # fiscal period is 214 days."): the days the caller enters, or the 365 of a full year when
  # none are.
  - name: ca/fiscal_period_days
    params:
      class_rates: ca/cca_class_rates
    consumes:
      entered: ca/fish_fiscal_period_days_entered
    produces:
      output: ca/fish_fiscal_period_days
  # T2121 Area A "Total CCA claim for the year: Total of column 21 (enter on line 9936 of Part 4
  # amount ii minus any personal part and any CCA for business-use-of-home expenses)" (amount ii):
  # the CCA claimed on each class of the Area A list, at most its maximum, totalled.
  - name: ca/cca_claim_prorated
    params:
      class_rates: ca/cca_class_rates
    consumes:
      classes: ca/fish_cca_classes_adjusted
      fiscal_period_days: ca/fish_fiscal_period_days
    produces:
      output: ca/fish_cca_table_claim
  # T2121 Part 4 "Capital cost allowance (CCA). Enter amount ii of Area A minus any personal part
  # and any CCA for business-use-of-home expenses." (line 9936), first step: amount ii minus the
  # personal part of CCA, a caller input.
  - name: core/subtract
    consumes:
      amount: ca/fish_cca_table_claim
      less: ca/fish_cca_personal_part
    produces:
      output: ca/fish_cca_claim_less_personal_part
  # T2121 Part 4 line 9936, second step: that result minus the CCA for business-use-of-home
  # expenses, amount 7K "Capital cost allowance (business part only), which means amount ii of
  # Area A minus any portion of capital cost allowance that is for personal use or entered on
  # line 9936 of Part 4", a caller input.
  - name: core/subtract
    consumes:
      amount: ca/fish_cca_claim_less_personal_part
      less: ca/fish_home_cca
    produces:
      output: ca/fish_cca_claim
  # T2121 Part 4 "Total expenses: Amount 4Q plus line 9936" (line 9368): the two added.
  - name: core/sum
    consumes:
      parts:
        - ca/fish_expenses_subtotal
        - ca/fish_cca_claim
    produces:
      output: ca/fish_total_expenses
  # T2121 Part 4 "Net income (loss) before adjustments: Amount 4A minus line 9368" (line 9369)
  # before the limit of the boat mainly for personal use below: signed. The immediate expensing
  # check reads this amount, as endnote 5's income is "before any CCA deductions".
  - name: core/subtract
    consumes:
      amount: ca/fish_gross_income_before_expenses
      less: ca/fish_total_expenses
    produces:
      output: ca/fish_net_income_before_boat_limit
  # Guide T4002 "Use of a fishing boat mainly for personal use" "You may have used a fishing boat
  # mainly for personal use, but sometimes caught a small amount of fish to sell": the answer to a
  # yes or no question, a count of 1 or 0, checked before the step that reads it. A count of 2 or
  # more is refused, not capped.
  - name: ca/yes_or_no_count
    consumes:
      count: ca/fish_boat_mainly_personal
    produces:
      output: ca/fish_boat_mainly_personal_checked
  # Guide T4002 "the amount you deduct cannot be more than your income from the catch": the lesser
  # of line 9368 and amount 4A, the gross income of Part 3.
  - name: core/lesser_of
    consumes:
      amounts:
        - ca/fish_total_expenses
        - ca/fish_gross_income_before_expenses
    produces:
      output: ca/fish_expenses_limited_to_catch_income
  # Guide T4002 "you can deduct expenses and CCA. However, the amount you deduct cannot be more than
  # your income from the catch": a count of 1 for a boat mainly for personal use chooses the limited
  # amount; with a count of 0 it is line 9368.
  - name: core/choose_by_count
    consumes:
      count: ca/fish_boat_mainly_personal_checked
      when_none: ca/fish_total_expenses
      when_any: ca/fish_expenses_limited_to_catch_income
    produces:
      output: ca/fish_total_expenses_deductible
  # T2121 Part 4 "Net income (loss) before adjustments: Amount 4A minus line 9368" (line 9369):
  # signed, a loss is negative; line 9368 is the deductible total, which is line 9368 itself unless
  # the boat was mainly for personal use.
  - name: core/subtract
    consumes:
      amount: ca/fish_gross_income_before_expenses
      less: ca/fish_total_expenses_deductible
    produces:
      output: ca/fish_net_income_before_adjustments
