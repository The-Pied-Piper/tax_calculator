    produces:
      output: ca/t1139_reported_total_on_professional_line
  # The statements of line 13700 that no Form T1139 takes the place of.
  - name: core/subtract
    consumes:
      amount: ca/t1139_statements_on_professional_line
      less: ca/t1139_replaced_total_on_professional_line
    produces:
      output: ca/t1139_kept_on_professional_line
  # T1 line 23 and line 13700 "Net": the statements with no Form T1139 plus amount G or L of each
