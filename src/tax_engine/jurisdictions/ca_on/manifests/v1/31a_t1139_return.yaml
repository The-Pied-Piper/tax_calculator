# Form T1139 (2025), "Report amount G as self-employment income on your return: For business income,
# enter it at line 13500 ... For fishing income, enter it at line 14300" (amount L under Part 5,
# the same): the summary form ca/t1139_return, run once. For each of the lines 13500, 13700, 13900,
# 14100 and 14300 it takes the net income of the statements of the line (line 9946 of Forms T2125,
# T2042 and T2121, the lists the return totalled before this form), leaves out the net income of the
# statements a Form T1139 takes the place of (ca/t1139.t1139_replaced_on_*) and adds the net income
# the forms tell the filer to report (ca/t1139.t1139_reported_on_*). With no Form T1139 the line is
# the total of its statements, as before. Its exports are the five lines, which T1 lines 22 to 26
# read in place of the statement lists (03_income.yaml and the copies of those steps). It also
# exports the same five lines as profits (ca/t1139_<line>_profit_on_return) for the readers of "net
# self-employment income (not including losses)": Form T1-M line 28, Form T929 line 4 and the
# medical expense supplement, which "use only the profit amounts" of the businesses on a line, so
# each statement and each Form T1139's amount G or L counts alone and a loss counts 0.
form:
  name: ca/t1139_return
  required: true
  exports:
    - ca/t1139_business_income_on_return
    - ca/t1139_professional_income_on_return
    - ca/t1139_commission_income_on_return
    - ca/t1139_farming_income_on_return
    - ca/t1139_fishing_income_on_return
    - ca/t1139_business_profit_on_return
    - ca/t1139_professional_profit_on_return
    - ca/t1139_commission_profit_on_return
    - ca/t1139_farming_profit_on_return
    - ca/t1139_fishing_profit_on_return
capabilities:
  # T1 line 22 and line 13500 "Net": Form T2125 line 9946 "... business income on line 13500", for
  # each statement the return carries, added. With no statement the total is 0.
  - name: core/record_total
    consumes:
      records: ca/t2125.net_on_business_line
    produces:
      output: ca/t1139_statements_on_business_line
  # The net income of the statements that a Form T1139 takes the place of on line 13500, added over
  # the forms; 0 with no Form T1139.
  - name: core/record_total
    consumes:
      records: ca/t1139.t1139_replaced_on_business_line
    produces:
      output: ca/t1139_replaced_total_on_business_line
  # Amount G or L of each Form T1139 reported on line 13500, "For business income, enter it at line
  # 13500", added over the forms; 0 with no Form T1139.
  - name: core/record_total
    consumes:
      records: ca/t1139.t1139_reported_on_business_line
    produces:
      output: ca/t1139_reported_total_on_business_line
  # The statements of line 13500 that no Form T1139 takes the place of.
  - name: core/subtract
    consumes:
      amount: ca/t1139_statements_on_business_line
      less: ca/t1139_replaced_total_on_business_line
    produces:
      output: ca/t1139_kept_on_business_line
  # T1 line 22 and line 13500 "Net": the statements with no Form T1139 plus amount G or L of each
  # Form T1139 on this line.
  - name: core/sum
    consumes:
      parts:
        - ca/t1139_kept_on_business_line
        - ca/t1139_reported_total_on_business_line
    produces:
      output: ca/t1139_business_income_on_return
  # T1 line 23 and line 13700 "Net": Form T2125 line 9946 "... professional income on line 13700",
  # for each statement the return carries, added. With no statement the total is 0.
  - name: core/record_total
    consumes:
      records: ca/t2125.net_on_professional_line
    produces:
      output: ca/t1139_statements_on_professional_line
  # The net income of the statements that a Form T1139 takes the place of on line 13700, added over
  # the forms; 0 with no Form T1139.
  - name: core/record_total
    consumes:
      records: ca/t1139.t1139_replaced_on_professional_line
    produces:
      output: ca/t1139_replaced_total_on_professional_line
  # Amount G or L of each Form T1139 reported on line 13700, "For professional income, enter it at
  # line 13700", added over the forms; 0 with no Form T1139.
  - name: core/record_total
    consumes:
