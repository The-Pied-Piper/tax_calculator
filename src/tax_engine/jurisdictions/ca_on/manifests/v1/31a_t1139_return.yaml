  # T1 line 25 and line 14100 "Net": Form T2042 line 9946 "(enter this amount on line 14100 of your
  # income tax and benefit return)", with the restricted farm loss added back (ca/farm_loss), for
  # each statement the return carries, added. With no statement the total is 0.
  - name: core/record_total
