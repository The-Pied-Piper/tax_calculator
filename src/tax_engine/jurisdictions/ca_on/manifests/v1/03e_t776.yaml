# Form T776, Statement of Real Estate Rentals: the form ca/t776, run once for each statement of the
# list ca/t776_statements (one for each rental operation; any number, none included). Each
# statement's fields are the T776 inputs. The form exports its line 9946 "Your net income (loss)",
# which T1 line 12600 "Net" adds over the statements, its line 8299 "Total gross rental income",
# which T1 line 12599 "Gross" adds over the statements; the net rental income before CCA
# (`ca/rental_income_before_cca`) and the CCA claim on the own properties
# (`ca/rental_cca_claim_on_own_properties`), which 03z_t776_cca_limit_all_statements.yaml reads;
# and the lines nothing on the return reads, which it
# also exports, one record for each statement: Area B line 9925 and Area C line 9927
# (03e_t776_additions.yaml), Area F lines 9923 and 9924 (the land additions and
# dispositions), taken as entered and printed, the co-owner's
# share of line 9369 checked against its lower bound (`ca/rental_coowner_share_lower_checked`, in
# 03e_t776_checks.yaml), and the checked count of the T5013 slip conflicts
# (`ca/rental_t5013_slip_conflict_checked`) and of the amount 7 conflicts
# (`ca/rental_partner_amount_7_conflict_checked`, in 03z_t776_partner_amount_7.yaml).
form:
  name: ca/t776
  required: true
  instances: ca/t776_statements
  exports:
    - ca/net_rental_income
    - ca/gross_rental_income
    - ca/short_term_rental_gross_rents
    - ca/rental_short_term_portion
    - ca/rental_closing_ucc
    - ca/rental_non_compliant_cca
    - ca/short_term_rental_non_compliant_cca_by_class
    - ca/rental_immediate_expensing_claim
    - ca/rental_immediate_expensing_limit_unprorated
    - ca/rental_equipment_additions_total
    - ca/rental_building_additions_total
    - ca/rental_land_additions
    - ca/rental_land_dispositions
    - ca/rental_coowner_share_lower_checked
    - ca/rental_t5013_slip_conflict_checked
    - ca/rental_partner_amount_7_conflict_checked
    - ca/rental_income_before_cca
    - ca/rental_cca_claim_on_own_properties
  fields:
    - name: ca/rental_properties
      required: true
    - name: ca/rental_other_income
      required: true
    - name: ca/rental_advertising
      required: true
    - name: ca/rental_advertising_personal_portion
      required: true
    - name: ca/rental_advertising_short_term_portion
      required: true
    - name: ca/rental_insurance
      required: true
    - name: ca/rental_insurance_personal_portion
      required: true
    - name: ca/rental_insurance_short_term_portion
      required: true
    - name: ca/rental_interest_and_bank_charges
      required: true
    - name: ca/rental_interest_and_bank_charges_personal_portion
      required: true
    - name: ca/rental_interest_and_bank_charges_short_term_portion
      required: true
    - name: ca/rental_office_expenses
      required: true
    - name: ca/rental_office_expenses_personal_portion
      required: true
    - name: ca/rental_office_expenses_short_term_portion
      required: true
    - name: ca/rental_professional_fees
      required: true
    - name: ca/rental_professional_fees_personal_portion
      required: true
    - name: ca/rental_professional_fees_short_term_portion
      required: true
    - name: ca/rental_management_and_administration_fees
      required: true
    - name: ca/rental_management_and_administration_fees_personal_portion
      required: true
    - name: ca/rental_management_and_administration_fees_short_term_portion
      required: true
    - name: ca/rental_repairs_and_maintenance
      required: true
    - name: ca/rental_repairs_and_maintenance_personal_portion
      required: true
    - name: ca/rental_repairs_and_maintenance_short_term_portion
      required: true
    - name: ca/rental_salaries_wages_and_benefits
      required: true
    - name: ca/rental_salaries_wages_and_benefits_personal_portion
      required: true
    - name: ca/rental_salaries_wages_and_benefits_short_term_portion
      required: true
    - name: ca/rental_property_taxes
      required: true
    - name: ca/rental_property_taxes_personal_portion
      required: true
    - name: ca/rental_property_taxes_short_term_portion
      required: true
    - name: ca/rental_travel
      required: true
    - name: ca/rental_travel_personal_portion
      required: true
    - name: ca/rental_travel_short_term_portion
      required: true
    - name: ca/rental_utilities
      required: true
    - name: ca/rental_utilities_personal_portion
      required: true
    - name: ca/rental_utilities_short_term_portion
      required: true
    - name: ca/rental_motor_vehicle_expenses
      required: true
    - name: ca/rental_motor_vehicle_expenses_personal_portion
      required: true
    - name: ca/rental_motor_vehicle_expenses_short_term_portion
      required: true
    - name: ca/rental_other_expenses
      required: true
    - name: ca/rental_other_expenses_personal_portion
      required: true
    - name: ca/rental_other_expenses_short_term_portion
      required: true
    - name: ca/short_term_rental_units
