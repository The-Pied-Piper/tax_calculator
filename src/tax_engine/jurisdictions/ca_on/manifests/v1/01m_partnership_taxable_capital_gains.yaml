# The shared fact "partnership taxable capital gains": the form ca/partnership_taxable_capital_gains,
# a form of its own with no instances, run once on one input, ca/partnership_taxable_capital_gains
# (the return's inputs, in 01_inputs.yaml). Two CRA forms carve the same amount out of line 12200 in
# the same words: Form T936 Part 2 line 10 "Net income from limited or non-active partnership (line
# 12200) other than taxable capital gains" and Form T2048 Chart A line 13 "Net income from limited
# or non-active partnership (line 12200) other than taxable capital gains". The input is the
# taxable capital gains that the line 12200 amount includes; it is entered once, here, and both
# forms read this form's export, so the two cannot differ.
#
# This is a targeted exception to taking inputs the way the form does: a fact gets a form of its
# own like this only when two CRA forms ask the very same fact. It is not a way to merge inputs
# that merely look alike, and every other input is still taken the way the form asks it.
#
# The form has no step and no computed line. It exports the input as entered. Each of the two
# forms reads the export as a record list of one record, totalled by `core/record_total` into its
# own line and taken off line 12200 with `core/subtract`, with no limit (the form prints none; the
# form ca/t2048 does so in 06a_capital_gains_deduction_qbt.yaml).
form:
  name: ca/partnership_taxable_capital_gains
  required: true
  exports:
    - ca/partnership_taxable_capital_gains
