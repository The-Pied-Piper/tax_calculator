# Form T746 (2025), lines 1 to 4: the form ca/t746_year, run once for each record of its list
# ca/t746_years (one record for each year of unused contributions, none included). Line 3 is part of line
# 2, so an amount above line 2 is refused, not capped; line 4 is line 2 minus line 3. Its exports are line 4,
# which the summary form ca/t746 (05y_t746.yaml) reads as ca/t746_year.t746_unused_contributions_of_year,
# and line 1, the year, exported as entered (no step reads it).
form:
  name: ca/t746_year
  required: true
  instances: ca/t746_years
  exports:
    - ca/t746_unused_contributions_of_year
    - ca/t746_contribution_year
  fields:
    - name: ca/t746_contribution_year
      required: true
    - name: ca/t746_contributions
      required: true
    - name: ca/t746_contributions_deducted
      required: true
capabilities:
  # Line 3 "Enter the part of the amount from line 2 that you deducted or will be deducting": a part of
  # line 2, so at most line 2 (the form prints no bound of its own; refused above it, not capped).
  - name: core/at_most
    consumes:
      amount: ca/t746_contributions_deducted
      bound: ca/t746_contributions
    produces:
      output: ca/t746_contributions_deducted_checked
  # Line 4 "Line 2 minus line 3": the unused RRSP, PRPP and SPP contributions for the year shown on line 1.
  - name: core/subtract
    consumes:
      amount: ca/t746_contributions
      less: ca/t746_contributions_deducted_checked
    produces:
      output: ca/t746_unused_contributions_of_year
