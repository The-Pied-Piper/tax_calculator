# The shared fact "non active partnership losses": the form ca/non_active_partnership_losses, a
# form of its own with no instances, run once on one input, ca/non_active_partnership_losses (the
# return's inputs, in 01_inputs.yaml). Two CRA forms ask it in the same words: Form T936 Part 1
# line 3 "Limited or non-active partnership losses (line 12200) other than allowable capital
# losses" and Form T2048 Chart A line 3 "Limited or non-active partnership losses (line 12200)
# other than allowable capital losses". It is entered once, here, and both forms read this form's
# export, so the two cannot differ.
#
# This is a targeted exception to taking inputs the way the form does: a fact gets a form of its
# own like this only when two CRA forms ask the very same fact. It is not a way to merge inputs
# that merely look alike, and every other input is still taken the way the form asks it.
#
# The form has no step and no computed line. It exports the input as entered. Each of the two
# forms reads the export as a record list of one record, totalled by `core/record_total` into its
# own line (the form ca/t2048 does so in 06a_capital_gains_deduction_qbt.yaml).
form:
  name: ca/non_active_partnership_losses
  required: true
  exports:
    - ca/non_active_partnership_losses
